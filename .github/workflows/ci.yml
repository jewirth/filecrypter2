name: build-and-test
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Configure with runner OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DOPENSSL_ROOT_DIR="$env:ProgramFiles/OpenSSL"
          "$env:ProgramFiles\OpenSSL\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Check memory and undefined behavior (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-sanitize -DFILECRYPTER_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-sanitize
          ctest --test-dir build-sanitize --output-on-failure
