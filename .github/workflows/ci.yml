name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Install OpenSSL and configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
